<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTO JANELA</title>
</head>
<body onresize="acao()">
    <script>
        function acao(){
            alert('Ação Disparada!')
        }
    </script>



    <!--
onresize – quando a página é redimensionada.

onscroll – quando o scroll no mouse é acionado.

onload – quando a página carrega.

onbeforeunload – instantes antes de sair da página.
    -->




</body>
</html>
