<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
    <script>

        var conceito = prompt('Digite o seu parametro:'); 

        switch(conceito){
            case 'A':
                document.write('Exelente');
                break
            case 'B':
                document.write('ótimo');
                break
            case 'C':
                document.write('Bom');
                break
            case 'D':
                document.write('Regular');
                break
            case 'E': 
            document.write('Ruim');
                break
            case 'F': 
            document.write('Até ano que vem!');
                break
            default:
                document.write('Não encontrado!');
                
        }
    </script>
</head>
<body>
    
</body>
</html>
