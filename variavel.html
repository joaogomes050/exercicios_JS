<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício varialvel JS</title>
    <script>
        var nome = prompt ('Qual o se nome?');
        var idade = prompt ('Qual a sua idade?');
        var saldo = 500.00;
    </script>
</head>
<body>
    <h1>Variáveis</h1>
    <script>
        document.write('<h1> Olá ' + nome + ', tudo bem? Sua idade é de ' + idade + ' e seu saldo é de ' + saldo + ' reais, certo? </h1>'
        );
    </script>
</body>
</html>
