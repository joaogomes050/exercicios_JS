<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF E ELSE</title>
    <script>
        var chuva = prompt('Está chovendo?')
        var temp = prompt('Qual a temperatura atual?')

        if(chuva == "Não" && temp >= 25){
            document.write('VAMOS PARA PRAIA')
        }else{
            document.write('ESCOLHA OUTRO DESTINO!')
        }
    </script>
</head>

</html>
