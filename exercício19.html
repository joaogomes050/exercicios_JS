<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>

    <input type="text" id="letra" onkeyup="placaLetra()"> 
    <input type="text" id="saiLetra"disabled='disabled'>
    <input type="number" id="numero" disabled="disabled" >

    <script>
        function placaLetra(){
            var caracter = document.getElementById('letra').value;
            if(caracter == "1" || caracter == "2" || caracter == "3" || caracter == "4" || caracter == "5" || caracter == "6" || caracter == "7" || caracter == "8" || caracter == "9" || caracter == "0") {
                document.getElementById('numero').value = caracter;
            }else{
            document.getElementById('saiLetra').value = caracter;
            }
            document.getElementById('letra').value = null;
        }
    </script>
</body>
</html>
