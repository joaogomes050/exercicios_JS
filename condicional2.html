<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF e ELSE</title>
    <script>
        var nota = prompt('Digite a sua nota:');
        var frequencia = prompt ('Digite a sua frequênca:');
        var media = 7;
        var freq = 75;
    </script>
</head>
<body>
    <script>
        if(nota >= media && frequencia >= freq){
            document.write('APROVADO');
        }else{
            document.write('REPROVADO, ATÉ 2027!')
        }
        
        
    </script>
</body>
</html>
