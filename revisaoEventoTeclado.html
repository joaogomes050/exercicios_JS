<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTO TECLADO</title>
</head>
<body>
    <script>
        function acao(){
            alert('Ação Chamada!')
        }
    </script>
    <input onkeyup="acao()" type="text" placeholder="Digite algo"/>
    <!--
onkeydown – quando uma tecla é pressionada.

onkeypress – quando eu mantenho a tecla pressionada. (somente caracteres)

onkeyup – quando a tecla é liberada.
    -->
</body>
</html>
