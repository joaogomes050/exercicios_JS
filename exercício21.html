<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOR simples</title>
</head>
<body>
    <script>
        var preco = [10.02 , 23.90 , 99.99 , 25.50]
        var total = 0;

        for(var i = 0; i <preco.length; i++){
            total+= preco[i];
        }

        alert(total.toFixed(2))
    </script>
</body>
