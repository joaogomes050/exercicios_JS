    <script>

        var km = Number(prompt('Digite o KM percorrido:'));
        var litros = Number(prompt('Digite quantos litros foi gasto:'));

        function calcularMedia(a,b){
            var media = a / b;
            return media;
        }

        var result = calcularMedia(km, litros);
        document.write(Math.round(result));
    </script>
