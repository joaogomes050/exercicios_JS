<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Caixa Eletrônico</title>
</head>

<body onload="iniciarSistema()">

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">Caixa Eletrônico</h2>

            <div class="mb-3">
                <label class="form-label">Agência</label>
                <input type="text" class="form-control" placeholder="Digite sua agência">
            </div>

            <div class="mb-3">
                <label class="form-label">Conta</label>
                <input type="text" class="form-control" placeholder="Digite sua conta">
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" placeholder="Digite sua senha" onkeyup="monitorarTeclado()">
            </div>

            <button class="btn btn-success w-100" onclick="confirmarOperacao()">
                Confirmar Operação
            </button>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>


        function iniciarSistema() {
            alert("Caixa Eletrônico Pronto. Insira seus dados.");
        }


        function monitorarTeclado() {
            console.log("Detectando digitação segura...");
        }


        function confirmarOperacao() {
            alert("Processando transação... Por favor, aguarde.");
        }


        window.onbeforeunload = function () {
            return "Deseja realmente sair do site do banco?";
        };

    </script>

</body>

</html>
