<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 03</title>
     <script>
        var nome = prompt('Qual o seu nome?');
        var salario = parseInt( prompt('Qual é o seu salário?'));
        var venda = parseInt(prompt('Qual sua venda?'));
        var comissao = 0;
    </script>
</head>
<body>
    <script>
        comissao = venda * 0.025;
        salario = salario + comissao;

        document.write('<h1>Olá ' + nome + ' seu salário desse mês será de ' + salario + '</h1>');
    </script>
    
</body>
</html>
